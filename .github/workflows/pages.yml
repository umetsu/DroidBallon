name: Deploy DroidBallon to GitHub Pages

on:
  push:
    branches: [master]
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, closed, edited]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/master' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sites: ${{ steps.sites.outputs.result }}
    steps:
      - uses: actions/github-script@v7
        id: sites
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: master } = await github.rest.repos.getBranch({ owner, repo, branch: 'master' });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'master', per_page: 100
            });
            const previews = openPulls
              .filter(pr => pr.head.repo?.full_name.toLowerCase() === `${owner}/${repo}`.toLowerCase())
              .map(pr => ({ name: `pr-${pr.number}`, ref: pr.head.sha }));
            return [{ name: 'production', ref: master.commit.sha }, ...previews];

  build:
    needs: plan
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.sites) }}
    continue-on-error: ${{ matrix.name != 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: ${{ matrix.name == 'production' && 'npm' || '' }}
      - run: npm ci
      - run: npm test
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R js assets _site/
          find _site -name .DS_Store -delete
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.name }}
          path: _site/
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      previews: ${{ steps.assemble.outputs.previews }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-production
          path: _site
      - uses: actions/download-artifact@v4
        with:
          pattern: site-pr-*
          path: _preview_artifacts
      - name: Assemble production and PR previews
        id: assemble
        run: |
          shopt -s nullglob
          previews=()
          for artifact in _preview_artifacts/site-pr-*; do
            pr=${artifact##*/site-pr-}
            [[ "$pr" =~ ^[0-9]+$ ]] && [[ -f "$artifact/index.html" ]] || continue
            mkdir -p _site/pr-preview
            mv "$artifact" "_site/pr-preview/$pr"
            previews+=("$pr")
          done
          echo "previews=${previews[*]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: List deployed previews
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PREVIEWS: ${{ needs.package.outputs.previews }}
        run: |
          {
            echo '### GitHub Pages'
            echo "- [DroidBallon]($PAGE_URL)"
            read -r -a previews <<< "$PREVIEWS"
            for pr in "${previews[@]}"; do
              echo "- [PR #$pr](${PAGE_URL%/}/pr-preview/$pr/)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
